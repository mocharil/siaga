# ==============================================================================
# SIAGA Logrotate Configuration (T26)
#
# Prevents SIAGA logs from overflowing the 20 GB disk on the VPS.
# Daily rotation, 7 days retention, compressed, copytruncate.
# ==============================================================================

/app/logs/*.log
/var/log/siaga/*.log
/opt/siaga/logs/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0640 root root
}
