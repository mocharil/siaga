# ==============================================================================
# SIAGA Logrotate Configuration (T26)
#
# Prevents SIAGA logs from overflowing the 20 GB disk on the VPS.
# Daily rotation, 7 days retention, compressed, copytruncate.
# ==============================================================================

/home/siaga/siaga/logs/*.log
/var/log/siaga/*.log
/opt/siaga/logs/*.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su siaga siaga
    create 0644 siaga siaga
}
